<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="password-card">
            <!-- Header -->
            <div class="header">
                <span class="badge">
                    your password is safe with us
                </span>
                <h1>Password Generator</h1>
                <p>
                    Create strong and secure passwords in seconds.
                </p>
            </div>
            <!-- Password Display -->
            <div class="password-box">
    <input
        type="text"
        id="password"
        placeholder="Enter your password..."
        autocomplete="off"
    >
    <button id="copyBtn">
        Copy
    </button>
</div>
            <!-- Password Strength -->
            <div class="strength-container">
                <div class="strength-info">
                    <span>
                        Password Strength
                    </span>
                    <strong id="strengthText">
                        Medium
                    </strong>
                </div>
                <div class="strength-bar">
                    <div id="strengthBar"></div>
                </div>
            </div>
            <!--Password Length -->
            <div class="option">
                <div class="option-header">
                    <label>
                        Password Length
                    </label>
                    <span id="lengthValue">
                        16
                    </span>
                </div>
                <input
                    type="range"
                    id="length"
                    min="8"
                    max="32"
                    value="16"    >
            </div>
            <!-- Password Options -->
            <div class="options">
                <label class="checkbox">
                    <input
                        type="checkbox"
                        id="uppercase"
                        checked
                    >
                    <span>
                        Uppercase Letters
                    </span>
                </label>
                <label class="checkbox">
                    <input
                        type="checkbox"
                        id="lowercase"
                        checked
                    >
                    <span>
                        Lowercase Letters
                    </span>
                </label>
                <label class="checkbox">
                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >
                    <span>
                        Numbers
                    </span>
                </label>
                <label class="checkbox">
                    <input
                        type="checkbox"
                        id="symbols"
                        checked
                    >
                    <span>
                        Symbols
                    </span>
                </label>
            </div>
            <!-- Generate Button -->
            <button
                id="generateBtn"
                class="generate-btn"
            >
                Generate Password
            </button>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
